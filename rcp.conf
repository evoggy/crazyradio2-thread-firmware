# Crazyradio 2.0 additions to the nRF Connect SDK OpenThread coprocessor sample

# Spinel over USB CDC ACM to the host (OpenThread Border Router)
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Bitcraze AB"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Crazyradio 2.0 Thread"
CONFIG_CDC_ACM_SERIAL_VID=0x35F0
CONFIG_CDC_ACM_SERIAL_PID=0xB001
CONFIG_UART_LINE_CTRL=y

# The USB stack delivers its messages on the system workqueue. The RCP default
# of 320 bytes overflows right after enumeration (the sample's nRF52840 Dongle
# config uses 400)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Restart instead of halting on a fatal error, the border router recovers
# from an RCP reset but not from a hung RCP
CONFIG_RESET_ON_FATAL_ERROR=y

# The nRF21540 FEM is controlled over GPIO and SPI
CONFIG_GPIO=y
